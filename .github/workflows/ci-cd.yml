name: Build DigiBoard SPA

on:
  push:
    branches: [main, master, prod]
  pull_request:
    branches: [main, master, prod]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check (format, lint, types)
        run: vp check

      - name: Run tests
        run: vp test

      - name: Build project
        run: vp build

      # GitHub Pages 项目站点不带 SPA 回退：把 index.html 复制为 404.html，
      # 直接访问/刷新 /digiboard/play 时仍能交给前端路由处理。
      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
